# Publishes this release's notes to the public website (the app's public site repo).
#
# Dispatched by ci.yml right after it tags a version — the same pattern as the
# release workflow, because tags pushed with GITHUB_TOKEN never fire `on: push`.
# Extracts feat:/fix: subjects between the previous tag and this one, rewrites
# the version's entry in docs/releases.json (idempotent — safe to re-run), and
# pushes to the site repo over a deploy key. GitHub Pages redeploys on its own.
name: 📝 Site Release Notes (kit)

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.25.0)"
        type: string
        required: true
      site_repo:
        description: "owner/repo of a separate public site repo (empty = the app repo's own docs/)"
        type: string
        default: ""

jobs:
  publish:
    runs-on: [self-hosted, macos]
    steps:
      - name: Check out app history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Extract notes for this release
        id: notes
        run: |
          TAG="${{ inputs.tag }}"
          PREV=$(git tag --sort=creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -B1 -x "$TAG" | head -1)
          if [ "$PREV" = "$TAG" ] || [ -z "$PREV" ]; then RANGE="$TAG"; else RANGE="$PREV..$TAG"; fi
          echo "Range: $RANGE"
          git log --format=%s "$RANGE" > /tmp/subjects.txt
          DATE=$(git log -1 --format=%cs "$TAG")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # The written App Store copy, when the app keeps one. Without it a
          # public page shows conventional-commit subjects — "fix(flights):
          # refuse an arrival prediction that contradicts the timetable" — which
          # is honest, and addressed to whoever wrote it rather than to whoever
          # is reading. The subjects stay underneath as the changelog.
          : > /tmp/summary.txt
          for CANDIDATE in fastlane/metadata/en-US/release_notes.txt \
                           fastlane/metadata/en-GB/release_notes.txt; do
            if [ -f "$CANDIDATE" ]; then cp "$CANDIDATE" /tmp/summary.txt; break; fi
          done

          # And the same copy in every other language the app is written in.
          # These already exist — an app that localises its listing writes them
          # for the App Store — and until now they were read past in favour of
          # en-US, so a Russian reader got a Russian store page and an English
          # site. First candidate wins per language, matching the loop above.
          for PAIR in "es:es-ES es-MX" "pt:pt-PT pt-BR" "ru:ru" \
                      "fr:fr-FR fr-CA" "de:de-DE" "it:it" "nl:nl-NL"; do
            CODE="${PAIR%%:*}"
            for LOCALE in ${PAIR#*:}; do
              F="fastlane/metadata/$LOCALE/release_notes.txt"
              if [ -f "$F" ]; then cp "$F" "/tmp/summary.$CODE.txt"; break; fi
            done
          done

      - name: Update releases.json on the site
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.site_repo }}" ]; then
            # Separate public site repo, pushed over a deploy key.
            KEYFILE="$RUNNER_TEMP/site_deploy_key"
            printf '%s\n' "$SITE_DEPLOY_KEY" > "$KEYFILE"
            chmod 600 "$KEYFILE"
            export GIT_SSH_COMMAND="ssh -i $KEYFILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            SITE="$RUNNER_TEMP/site"
            rm -rf "$SITE"
            git clone --depth 1 "git@github.com:${{ inputs.site_repo }}.git" "$SITE"
          else
            # In-repo site: the app repo's own docs/ serves GitHub Pages. The
            # checkout is at the release tag; switch to main to commit there.
            git fetch origin main
            git checkout -B main origin/main
            SITE="$PWD"
          fi

          TAG="${{ inputs.tag }}" DATE="${{ steps.notes.outputs.date }}" \
          python3 - "$SITE/docs/releases.json" <<'PY'
          import json, os, re, sys
          path = sys.argv[1]
          version = os.environ["TAG"].lstrip("v")
          date = os.environ["DATE"]
          notes = []
          for line in open("/tmp/subjects.txt"):
              m = re.match(r"^(feat|fix)(\(.+?\))?!?:\s*(.+)$", line.strip())
              if m:
                  text = m.group(3).strip()
                  notes.append({"type": m.group(1), "text": text[0].upper() + text[1:]})
          def read(path):
              try:
                  return open(path, encoding="utf-8").read().strip()
              except OSError:
                  return ""
          summary = read("/tmp/summary.txt")
          # Keyed by language, not storefront: the site serves /es/, not
          # /es-ES/ and /es-MX/, and both storefronts carry the same words.
          translations = {code: read(f"/tmp/summary.{code}.txt")
                          for code in ("es", "pt", "ru", "fr", "de", "it", "nl")}
          translations = {k: v for k, v in translations.items() if v}
          if not notes and not summary:
              print("Nothing to publish for this range.")
              sys.exit(0)
          releases = json.load(open(path)) if os.path.exists(path) else []
          releases = [r for r in releases if r["version"] != version]
          entry = {"version": version, "date": date, "notes": notes[::-1]}
          # Optional on purpose: an app with no release_notes.txt keeps exactly
          # the shape it had, so adding this cannot disturb a site that is not
          # ready to render it.
          if summary:
              entry["summary"] = summary
          # Additive and optional, exactly like `summary` above: an app with no
          # translated listing writes the same shape it always did, so this
          # cannot disturb the other apps that share this workflow.
          for code, text in translations.items():
              entry[f"summary_{code}"] = text
          releases.insert(0, entry)
          releases.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          os.makedirs(os.path.dirname(path), exist_ok=True)
          json.dump(releases, open(path, "w"), indent=1)
          print(f"Wrote {version}: {len(notes)} notes, summary={bool(summary)}, "
                f"translations={sorted(translations) or 'none'}.")
          PY

          cd "$SITE"
          if git diff --quiet -- docs/releases.json 2>/dev/null && git ls-files --error-unmatch docs/releases.json >/dev/null 2>&1; then
            echo "releases.json unchanged; nothing to push."
            exit 0
          fi
          git config user.name "release-kit-ci"
          git config user.email "ci@release-kit.invalid"
          git add docs/releases.json
          git commit -m "release notes: ${{ inputs.tag }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin main
          [ -n "${KEYFILE:-}" ] && rm -f "$KEYFILE" || true
