name: 🏪 Store Release (kit)

# Stages the App Store listing for an uploaded build and (optionally) submits
# it for review — metadata + screenshots from the caller repo's fastlane dirs.
on:
  workflow_call:
    inputs:
      asc_app_id:
        type: string
        required: true
      version:
        type: string
        required: true
      build_number:
        type: string
        required: true
      submit:
        type: boolean
        default: false
      meta_dir:
        type: string
        default: "fastlane/metadata"
      shots_dir:
        type: string
        default: "fastlane/screenshots/en-US"
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: {required: true}
      ISSUER_ID: {required: true}
      APP_STORE_CONNECT_API_KEY_BASE64: {required: true}

jobs:
  store:
    runs-on: [self-hosted, macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: muzaparoff/appstore-kit/actions/store-release@v1
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        with:
          asc_app_id: ${{ inputs.asc_app_id }}
          version: ${{ inputs.version }}
          build_number: ${{ inputs.build_number }}
          submit: ${{ inputs.submit }}
          meta_dir: ${{ inputs.meta_dir }}
          shots_dir: ${{ inputs.shots_dir }}
